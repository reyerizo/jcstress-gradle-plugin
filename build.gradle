buildscript {
    repositories {
        mavenLocal()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'net.researchgate:gradle-release:3.1.0'
    }
}

plugins {
    id 'jacoco'
    id 'java-gradle-plugin'
    id 'com.github.kt3k.coveralls' version '2.12.2'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'io.github.reyerizo.gradle'

apply plugin: 'net.researchgate.release'
apply plugin: 'groovy'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: "com.gradle.plugin-publish"

compileGroovy.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    withJavadocJar()
    withSourcesJar()
}

sourceSets {
    integration {
        groovy {
            srcDir 'src/integration/groovy'
        }
        resources {
            srcDir 'src/integration/resources'
        }

        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationImplementation.extendsFrom testImplementation
    integrationRuntimeOnly.extendsFrom testRuntimeOnly
}

idea {
    module {
        scopes.TEST.plus += [configurations.integrationRuntimeClasspath, configurations.integrationCompileClasspath]
    }
}

task integrationTest(type: Test) {
    testClassesDirs = sourceSets.integration.output.classesDirs
    classpath = sourceSets.integration.runtimeClasspath
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

rootProject.tasks.named("processIntegrationResources") {
    duplicatesStrategy = 'include'
}

dependencies {
    implementation localGroovy()
    implementation gradleApi()

    testImplementation('org.spockframework:spock-core:2.3-groovy-4.0') {
        exclude(module: 'groovy-all')
    }

    testImplementation 'commons-io:commons-io:2.11.0'
    testCompileOnly 'org.openjdk.jcstress:jcstress-core:0.16'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

afterReleaseBuild.dependsOn(publishPlugins)

// The pom of this publication is what the Gradle Plugin Portal publishes alongside the jar.
publishing {
    publications {
        pluginMaven(MavenPublication) {
            pom {
                name = 'Jcstress gradle plugin'
                description = 'This plugin integrates The Java Concurrency Stress tests with Gradle.'
                url = 'https://github.com/reyerizo/jcstress-gradle-plugin'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'jerzykrlk'
                        name = 'Jerzy Krolak'
                    }
                }
                scm {
                    connection = 'https://github.com/reyerizo/jcstress-gradle-plugin.git'
                    developerConnection = 'https://github.com/reyerizo/jcstress-gradle-plugin.git'
                    url = 'https://github.com/reyerizo/jcstress-gradle-plugin/tree/master'
                }
            }
        }
    }
}

gradlePlugin {
    website = 'https://github.com/reyerizo/jcstress-gradle-plugin'
    vcsUrl = 'https://github.com/reyerizo/jcstress-gradle-plugin'
    testSourceSets(sourceSets.test, sourceSets.integration)
    plugins {
        jcstressGradlePlugin {
            id = 'io.github.reyerizo.gradle.jcstress'
            displayName = 'Jcstress gradle plugin'
            description = 'This plugin integrates The Java Concurrency Stress tests with Gradle.'
            implementationClass = 'com.github.erizo.gradle.JcstressPlugin'
            tags.set(['jcstress'])
        }
    }
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    reports {
        xml.required = true // coveralls plugin depends on xml format report
        html.required = true
    }
}

coveralls {
    jacocoReportPath = 'build/reports/jacoco/test/jacocoTestReport.xml'
}

test {
    useJUnitPlatform()
}

/**
 * To release: gradlew clean build release
 *
 * That tags the release and publishes it to the Gradle Plugin Portal, which needs
 * gradle.publish.key and gradle.publish.secret in ~/.gradle/gradle.properties.
 */
